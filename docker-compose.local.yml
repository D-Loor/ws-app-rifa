services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: rifas-api:local
    container_name: rifas-api
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: rifas-mysql
      DB_PORT: 3306
      DB_DATABASE: rifas
      DB_USERNAME: rifas
      DB_PASSWORD: rifas
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rifas-net

  mysql:
    image: mysql:8.0
    container_name: rifas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rifas
      MYSQL_USER: rifas
      MYSQL_PASSWORD: rifas
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    mem_limit: 512m
    volumes:
      - rifas-mysql-data:/var/lib/mysql
    networks:
      - rifas-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

networks:
  rifas-net:
    name: rifas-net

volumes:
  rifas-mysql-data:
